inputs = "Ticker, CIK or accession number, form type, dates or a full-text query, after setting an SEC contact identity once"
outputs = "Typed filing objects, standardized multi-year statements as DataFrames, 10-K/10-Q section text, whole-filing Markdown, search hits"
keys_cost = "No API key; SEC needs a contact email on every request and allows 10 requests a second; hosted edgar.tools is the paid option"
orders = "none"
integrations = [
  { with = "finrobot", note = "FinRobot V2 desktop depends on edgartools for its SEC EDGAR data provider; documented on the FinRobot side", url = "https://github.com/AI4Finance-Foundation/FinRobot/blob/63e1884a42ea7b729551a5424b4bd6a65af636e0/finrobot_desktop/pyproject.toml?plain=1#L40" },
