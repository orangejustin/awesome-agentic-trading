# Component matrix: the components builders reach for most, for docs/components.md.
# Every fact comes from the project's own README, manifests or code at the commit the catalog checked
# (projects.toml last_sha); `sources` link to those lines. Nothing was installed or run unless
# `verification` says so:  docs = read at the pinned commit | install = installed and imported (verify_cmd,
# verify_env, verify_date, verify_result) | run = a documented example ran.
# `orders` must match the catalog entry; `integrations` are only pairings an upstream file documents.

[[component]]
id = "openbb"
language = "Python (platform and CLI); Rust and TypeScript for the Tauri desktop app"
runtime = "Python 3.10 to 3.14 per README (pyproject allows >=3.10,<4); desktop app binaries for macOS and Windows"
install = "pip install openbb"
interface = ["python-lib", "cli", "rest-api", "mcp", "desktop"]
inputs = "A command and its parameters, such as a ticker for obb.equity.price.historical, optionally naming the data provider"
outputs = "Typed results convertible to pandas DataFrames; the same commands served as a FastAPI REST API (port 6900) and as MCP tools"
keys_cost = "Many providers need no key (Cboe, SEC, ECB); FRED, BLS, EIA, Congress.gov and CFTC need their own keys; Workspace UI needs a sign-in"
orders = "none"
integrations = [
  { with = "vibe-trading", note = "Vibe-Trading's optional openbb extra registers it as an OpenBB Workspace custom agent; documented on the Vibe-Trading side", url = "https://github.com/HKUDS/Vibe-Trading/blob/3cbb167e9d7afab1682934685437efb96faacd43/README.md?plain=1#L1679" },
]
sources = [
  { what = "language", url = "https://github.com/OpenBB-finance/OpenBB/blob/7df7d0c5592bf25be88e87e130a05c71e243d2d8/openbb_platform/pyproject.toml?plain=1#L1-L8" },
