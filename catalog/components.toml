# ---------------------------------------------------------------- cross-layer recipes
# status: design = our proposal, not run end to end | upstream = the pairing is documented by its authors (links) |
#         run = we ran it end to end (none yet). A recipe is a starting point for your own integration test.

[[recipe]]
id = "factor-research-loop"
title = "Factor research loop: RD-Agent on Qlib"
status = "upstream"
why = "The one cross-layer pairing here that its authors document and ship: RD-Agent's quant scenarios run their factor and model proposals through Qlib's data and backtest."
steps = [
  { layer = "harness", component = "qlib", role = "data store, factor evaluation and backtest" },
  { layer = "application", component = "rd-agent", role = "proposes factors and models, writes the code, reads the results and iterates" },
]
gaps = "Every automatically proposed factor is another trial: count them and deflate the result (tools/evalkit), keep a held-out period the loop never sees, and add costs before believing a backtest. Upstream documents Linux and Docker for most scenarios."
links = [
  { label = "RD-Agent README: the Qlib scenarios", url = "https://github.com/microsoft/RD-Agent/blob/484776c211e4fbbeef03e0ec00d6bbee7362a4f4/README.md?plain=1#L271-L286" },
]

[[recipe]]
id = "auditable-research-desk"
title = "Research desk whose numbers you can audit"
status = "design"
why = "Primary filings in, a written view out, and every prompt change regression-tested and traced. Two of the joins are documented upstream: FinRobot V2's SEC EDGAR provider is built on edgartools, and promptfoo can pull prompts and traces from Langfuse."
steps = [
  { layer = "data", component = "edgartools", role = "pulls filings and XBRL financials as typed objects" },
  { layer = "application", component = "finrobot", role = "computes the figures with code and lets the model write around them" },
  { layer = "harness", component = "promptfoo", role = "regression tests for the research prompts, including prompt injection through filing text" },
  { layer = "harness", component = "langfuse", role = "traces every run with its inputs, tool calls and cost" },
]
gaps = "Not run end to end by us. Feeding FinRobot's runs into promptfoo tests and Langfuse traces is your work: neither project documents it. Record each filing's acceptance time, not the fetch time, and check the generated text against the computed numbers."
links = [
  { label = "FinRobot V2 depends on edgartools", url = "https://github.com/AI4Finance-Foundation/FinRobot/blob/63e1884a42ea7b729551a5424b4bd6a65af636e0/finrobot_desktop/pyproject.toml?plain=1#L40" },
  { label = "promptfoo's Langfuse integration", url = "https://github.com/promptfoo/promptfoo/blob/e48ed85e08ff8a1ca74fa7d0e41daf47cf155efb/site/docs/integrations/langfuse.md?plain=1#L6-L38" },
]

[[recipe]]
id = "paper-trading-agent"
title = "Paper-trading agent with guardrails"
status = "design"
why = "A decision framework that stops at a rating, an order tool that defaults to paper, and the ledger in between that neither ships."
steps = [
  { layer = "data", component = "openbb", role = "market and fundamental data for the analysts" },
  { layer = "agent", component = "tradingagents", role = "analyst debate that ends in a five-tier rating" },
  { layer = "execution", component = "alpaca-mcp-server", role = "paper orders, with ALPACA_TOOLSETS restricted to the tools the agent needs" },
  { layer = "harness", component = "langfuse", role = "a trace of each decision, tool call and order" },
]
gaps = "Not run end to end by us. TradingAgents emits ratings, not orders: position sizing, order-value and exposure limits in code, and reconciliation of intended against filled orders are yours to build. Paper fills are kinder than live ones, and one environment flag switches Alpaca to real money."
