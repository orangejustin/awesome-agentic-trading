[[article]]
title = "Effective harnesses for long-running agents"
author = "Justin Young (Anthropic)"
url = "https://www.anthropic.com/research/effective-harnesses-for-long-running-agents"
source = "blog"
date = "2025-11-26"
layer = "harness"
why = "An initializer agent sets up the scaffolding; a worker agent does one unit per session, tests end to end, and leaves git history and progress notes for the next session. The same pattern fits multi-day research and strategy builds."
why_zh = "先由初始化智能体搭好脚手架，再由工作智能体每次只完成一个单元、端到端测试，并为下一次会话留下 git 历史和进度记录。同样适用于持续多天的投研与策略开发。"
featured = true
checked = "2026-10-26"

[[article]]
