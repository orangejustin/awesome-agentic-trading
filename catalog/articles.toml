# Articles, docs, posts (including X) and podcasts. Source of truth for the "Articles and posts" sections.
# An entry is listed for the idea a builder can use; performance claims made in it are not verified here.
#   source   = x | blog | docs | news | newsletter | podcast | talk | paper | tool-page
#   date     = publication date (YYYY-MM-DD, or YYYY-MM when only the month is shown); "" is not allowed, use the check date
#              with date_note when the page shows none
#   checked  = the date someone opened the link and confirmed title, author and date
#   featured = true: also shown on the home page as essential reading (needs why_zh)
# Not accepted: private workspace links (Slack, Notion, Feishu), paywalled copies, posts whose main content is
# an unverifiable P&L claim or a referral link.

