# ---------------------------------------------------------------- 4. Harness

[[article]]
title = "Effective harnesses for long-running agents"
author = "Justin Young (Anthropic)"
url = "https://www.anthropic.com/research/effective-harnesses-for-long-running-agents"
source = "blog"
date = "2025-11-26"
layer = "harness"
why = "An initializer agent sets up the scaffolding; a worker agent does one unit per session, tests end to end, and leaves git history and progress notes for the next session. The same pattern fits multi-day research and strategy builds."
why_zh = "先由初始化智能体搭好脚手架，再由工作智能体每次只完成一个单元、端到端测试，并为下一次会话留下 git 历史和进度记录。同样适用于持续多天的投研与策略开发。"
featured = true
checked = "2026-10-26"

[[article]]
title = "Harness design for long-running application development"
author = "Prithvi Rajasekaran (Anthropic)"
url = "https://www.anthropic.com/research/harness-design-long-running-apps"
source = "blog"
date = "2026-03-24"
layer = "harness"
why = "Separate the generator from a skeptical evaluator, and revisit the harness with every new model to drop scaffolding it no longer needs. The case for an independent verifier, in practice."
checked = "2026-10-26"

[[article]]
title = "Building agents: When to fold subagents into your main agent loop"
author = "Diane Sarkis (Anthropic)"
url = "https://claude.com/resources/articles/building-agents-when-to-fold-subagents-into-your-main-agent-loop"
source = "blog"
date = "2026-10-22"
layer = "harness"
why = "Many agents do better as one loop with skills loaded on demand than as a coordinator with many subagents. Keep subagents for context isolation, parallel independent work or conflicting instructions, and migrate under evals. Directly relevant to analyst/risk/trader agent teams."
why_zh = "许多智能体用“单循环 + 按需加载技能”比“协调者 + 多个子智能体”效果更好；只在需要隔离上下文、并行独立任务或指令冲突时保留子智能体，并在评测下逐步迁移。直接适用于分析师/风控/交易员式的多智能体团队。"
featured = true
checked = "2026-10-26"

