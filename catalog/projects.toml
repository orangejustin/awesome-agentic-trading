# Projects. Source of truth for every repo the atlas cites.
# Verified 2026-10-21 (PT) against shallow clones (license, last commit) and GitHub pages (stars, as displayed).
# evidence: highest rung (L0-L4, see docs/02-evidence-ladder.md) a third party can inspect for the headline performance claim;
#   'bench' = evaluates other systems, 'n/a' = infrastructure or no performance claim.
# repro: can the headline numbers be regenerated from the repo? full | partial | none | unverified.
# read: teardown (docs/teardowns/) | readme (README skim only) | card (auto-extracted, cards/).

[[project]]
id = "tradingagents"
name = "TradingAgents"
repo = "TauricResearch/TradingAgents"
paper = "2412.20138"
kind = "framework"
layers = ["decision"]
license = "Apache-2.0"
stars = "112.4k"
stars_asof = "2026-10-21"
last_commit = "2026-10-16"
last_sha = "e8f5503"
evidence = "L2"
repro = "partial"
read = "teardown"
summary = "LangGraph 'trading firm': four analysts, bull/bear debate, research manager, trader, three-way risk debate, portfolio manager that emits a five-tier rating. Memory log settles each decision against later returns."
caveat = "The repo evaluates decision quality only (its backtest module says it is not a portfolio simulator) and contains no Sharpe or drawdown code; the paper's Table 1 harness is not included."

