# Repositories. Source of truth for every repo this list cites; README.md, README.zh-CN.md and layers/*.md are views of it.
# Every entry was re-verified on its `checked` date at the commit `last_sha` (full SHA, default-branch HEAD that day):
# license file read as text, last commit (committer date, US Pacific), README and code read for order authority.
#   layer / category  primary place in the five-layer stack (catalog/layers.toml); also = other layers it ships working code for
#   orders            live = code can send orders to a real venue (even if off or paper by default) | paper = forward-running
#                     simulated orders on live data, no path to a real venue | none = no order path, or only backtests/simulated markets
#   license_status    open = an open-source license file at the root | mixed = open core with parts under a non-open license |
#                     restricted = source-available (noncommercial, conflicting or non-open terms) | declared = an open license is
#                     stated (README, badge, manifest) but there is no license file | none = no license found
#   license_file      root path of the license file read, "" when there is none
#   maintenance       optional, only when upstream says so: archived | deprecated | unmaintained
#   sources           pinned links (blob at last_sha, with line numbers) for orders, license and maintenance claims
#   watch = true      the repository exists but holds no system code yet; shown on the layer page's watchlist
#   general = true    general-purpose tooling (not finance-specific) listed for the job it does in this layer
#   evidence / repro  see docs/02-evidence-ladder.md

