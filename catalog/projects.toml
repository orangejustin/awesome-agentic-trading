# Repositories. Source of truth for every repo this list cites; README.md, README.zh-CN.md and layers/*.md are views of it.
# Entries without `checked` were verified 2026-10-21 (PT) against shallow clones (license, last commit) and GitHub pages
# (stars, as displayed); an entry verified later carries its own `checked` date.
# layer / category: primary place in the five-layer stack (catalog/layers.toml); also = other layers it ships working code for.
# orders: live (can place real orders) | paper (paper trading only) | none (stated to place no trades); omitted = not stated.
# watch = true: the repository exists but holds no system code yet; shown on the layer page's watchlist, not in the directory.
# general = true: general-purpose tooling (not finance-specific) listed for the job it does in this layer.
# evidence: highest rung (L0-L4, see docs/02-evidence-ladder.md) a third party can inspect for the headline performance claim;
#   'bench' = evaluates other systems, 'n/a' = infrastructure or no performance claim.
# repro: can the headline numbers be regenerated from the repo? full | partial | none | unverified.
# read: teardown (docs/teardowns/) | readme (README skim only) | card (auto-extracted, cards/).

