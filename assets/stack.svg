<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Five layers of an agentic trading stack</title>
<desc id="d">Data, Agent and Execution in a pipeline, wrapped by a Harness that runs, tests and verifies them, with Applications on top.</desc>
<rect width="960" height="530" rx="16" fill="#F8FAFC"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="36" y="44" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start" >Five layers of an agentic trading stack</text>
<text x="36" y="66" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" >See, think, act; a harness to run, test and trust all three; applications on top.</text>
<rect x="36" y="88" width="888" height="78" rx="12" fill="#B453091F" stroke="#B45309" stroke-width="1.5"/>
<circle cx="58" cy="112" r="12" fill="#B45309"/>
<text x="58" y="117" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >5</text>
<text x="78" y="117" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Application: what you build with it</text>
<text x="50" y="142" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >Research desks and reports · AI funds · alpha factories · prediction-market bots</text>
<text x="908" y="117" font-size="12.5" font-weight="600" fill="#B45309" text-anchor="end" >11 repos · 8 papers</text>
<path d="M480 194 L480 170" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="36" y="196" width="888" height="304" rx="14" fill="#0478571F" stroke="#047857" stroke-width="1.5" stroke-dasharray="7 5"/>
<circle cx="58" cy="220" r="12" fill="#047857"/>
<text x="58" y="225" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4</text>
<text x="78" y="225" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Harness: how you run, test and trust it</text>
<text x="908" y="225" font-size="12.5" font-weight="600" fill="#047857" text-anchor="end" >17 repos · 17 papers</text>
<text x="50" y="482" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >Backtest environments · simulators · benchmarks and live arenas · bias control · agent loops, evals, traces and state</text>
<rect x="60" y="252" width="264" height="168" rx="12" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/>
<rect x="60" y="252" width="264" height="168" rx="12" fill="#0E74901F"/>
<circle cx="82" cy="276" r="12" fill="#0E7490"/>
<text x="82" y="281" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text>
<text x="102" y="281" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start" >Data</text>
<text x="102" y="299" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >what the agent sees</text>
<text x="76" y="330" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· Market, filing and news data</text>
<text x="76" y="350" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· MCP data servers, datasets</text>
<text x="76" y="370" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· Text into signals</text>
<text x="76" y="406" font-size="12" font-weight="600" fill="#0E7490" text-anchor="start" >10 repos · 5 papers</text>
<rect x="348" y="252" width="264" height="168" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="348" y="252" width="264" height="168" rx="12" fill="#4F46E51F"/>
<circle cx="370" cy="276" r="12" fill="#4F46E5"/>
<text x="370" y="281" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text>
<text x="390" y="281" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start" >Agent</text>
<text x="390" y="299" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >how it thinks</text>
<text x="364" y="330" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· Finance LLMs and reasoners</text>
<text x="364" y="350" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· Memory, reflection, debate</text>
<text x="364" y="370" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· Learned (RL) policies</text>
<text x="364" y="406" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="start" >8 repos · 22 papers</text>
<rect x="636" y="252" width="264" height="168" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="636" y="252" width="264" height="168" rx="12" fill="#B91C1C1F"/>
<circle cx="658" cy="276" r="12" fill="#B91C1C"/>
<text x="658" y="281" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text>
<text x="678" y="281" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start" >Execution</text>
<text x="678" y="299" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >how it acts</text>
<text x="652" y="330" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· Broker and venue tools</text>
<text x="652" y="350" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· Engines: backtest = live</text>
<text x="652" y="370" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· Weights into orders</text>
<text x="652" y="406" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="start" >6 repos · 1 paper</text>
<path d="M326 336 L344 336" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M614 336 L632 336" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M768 422 L768 446 L192 446 L192 426" stroke="#047857" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
<text x="480" y="440" font-size="12" font-weight="600" fill="#047857" text-anchor="middle" >fills and P&amp;L are scored against what the agent knew, when</text>
