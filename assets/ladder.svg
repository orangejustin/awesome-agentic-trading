<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" width="960" height="516" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The evidence ladder</title>
<desc id="d">Five rungs from an unchecked claim to a forward record, with the number of catalogued projects at each rung.</desc>
<rect width="960" height="516" rx="16" fill="#F8FAFC"/>
<text x="36" y="44" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start" >The evidence ladder</text>
<text x="36" y="66" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" >How far can someone other than the authors inspect the evidence for a project&#x27;s headline claim?</text>
<rect x="36" y="306" width="164" height="90" rx="10" fill="#E0E7FF"/>
<text x="50" y="336" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start" >L0</text>
<text x="50" y="358" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start" >Claim</text>
<text x="50" y="378" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" >Read it.</text>
<text x="118" y="424" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle" >4</text>
<text x="118" y="442" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" >catalog projects</text>
<rect x="216" y="260" width="164" height="136" rx="10" fill="#C7D2FE"/>
<text x="230" y="290" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start" >L1</text>
<text x="230" y="312" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start" >Runnable</text>
<text x="230" y="332" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" >Run it and see</text>
<text x="230" y="347" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" >decisions.</text>
<text x="298" y="424" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle" >10</text>
<text x="298" y="442" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" >catalog projects</text>
<rect x="396" y="214" width="164" height="182" rx="10" fill="#A5B4FC"/>
<text x="410" y="244" font-size="22" font-weight="800" fill="#0F172A" text-anchor="start" >L2</text>
<text x="410" y="266" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="start" >Disclosed backtest</text>
<text x="410" y="286" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" >Read the protocol and</text>
<text x="410" y="301" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" >table.</text>
<text x="478" y="424" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle" >8</text>
<text x="478" y="442" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" >catalog projects</text>
<rect x="576" y="168" width="164" height="228" rx="10" fill="#818CF8"/>
<text x="590" y="198" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start" >L3</text>
<text x="590" y="220" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" >Independent / OOS</text>
<text x="590" y="240" font-size="11.5" font-weight="400" fill="#E0E7FF" text-anchor="start" >Someone else reran</text>
<text x="590" y="255" font-size="11.5" font-weight="400" fill="#E0E7FF" text-anchor="start" >it, or it holds after</text>
<text x="590" y="270" font-size="11.5" font-weight="400" fill="#E0E7FF" text-anchor="start" >the cutoff.</text>
<text x="658" y="424" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle" >0</text>
<text x="658" y="442" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" >catalog projects</text>
<rect x="756" y="122" width="164" height="274" rx="10" fill="#4F46E5"/>
<text x="770" y="152" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="start" >L4</text>
<text x="770" y="174" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" >Forward record</text>
<text x="770" y="194" font-size="11.5" font-weight="400" fill="#E0E7FF" text-anchor="start" >Timestamped before</text>
<text x="770" y="209" font-size="11.5" font-weight="400" fill="#E0E7FF" text-anchor="start" >the outcome.</text>
<text x="838" y="424" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle" >2</text>
<text x="838" y="442" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" >catalog projects</text>
<path d="M36 400 L920 400" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="36" y="478" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >Not on the ladder: 42 projects that evaluate other systems (bench) or have no performance claim (n/a).</text>
<text x="36" y="496" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >The rung says what kind of evidence exists, not how good it is.</text>
</svg>
