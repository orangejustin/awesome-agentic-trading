<text x="390" y="281" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start" >Agent 層</text>
<text x="390" y="299" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >智慧體如何思考</text>
<text x="364" y="330" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 金融基礎模型與推理模型</text>
<text x="364" y="350" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 記憶、反思、辯論</text>
<text x="364" y="370" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 學習得到的（RL）策略</text>
<text x="364" y="406" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="start" >8 個倉庫 · 22 篇論文</text>
<rect x="636" y="252" width="264" height="168" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="636" y="252" width="264" height="168" rx="12" fill="#B91C1C1F"/>
<circle cx="658" cy="276" r="12" fill="#B91C1C"/>
<text x="658" y="281" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text>
<text x="678" y="281" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start" >執行層</text>
<text x="678" y="299" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >智慧體如何下單</text>
<text x="652" y="330" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 券商與交易所工具</text>
<text x="652" y="350" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 引擎：回測與實盤同一套程式碼</text>
<text x="652" y="370" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 把目標權重變成訂單</text>
<text x="652" y="406" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="start" >13 個倉庫 · 1 篇論文</text>
