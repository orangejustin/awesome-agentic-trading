<path d="M614 336 L632 336" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M768 422 L768 446 L192 446 L192 426" stroke="#047857" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
<text x="480" y="440" font-size="12" font-weight="600" fill="#047857" text-anchor="middle" >成交与盈亏，要对照智能体当时知道什么来评分</text>
