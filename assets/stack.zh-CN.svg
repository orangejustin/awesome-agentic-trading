<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">智能体交易系统的五层结构</title>
<desc id="d">数据层、Agent 层、执行层构成主流程，由负责运行、测试与核验的 Harness 层包裹，应用层位于最上方。</desc>
<rect width="960" height="530" rx="16" fill="#F8FAFC"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="36" y="44" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start" >智能体交易系统的五层结构</text>
<text x="36" y="66" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" >看见、思考、行动；Harness 负责运行、测试并建立信任；应用位于最上层。</text>
<rect x="36" y="88" width="888" height="78" rx="12" fill="#B453091F" stroke="#B45309" stroke-width="1.5"/>
<circle cx="58" cy="112" r="12" fill="#B45309"/>
<text x="58" y="117" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >5</text>
<text x="78" y="117" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >应用层：用它做出什么</text>
<text x="50" y="142" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >投研与研报 · AI 基金 · Alpha 工厂 · 预测市场机器人</text>
<text x="908" y="117" font-size="12.5" font-weight="600" fill="#B45309" text-anchor="end" >17 个仓库 · 8 篇论文</text>
<path d="M480 194 L480 170" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="36" y="196" width="888" height="304" rx="14" fill="#0478571F" stroke="#047857" stroke-width="1.5" stroke-dasharray="7 5"/>
<circle cx="58" cy="220" r="12" fill="#047857"/>
<text x="58" y="225" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4</text>
<text x="78" y="225" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Harness 层：如何运行、测试并信任它</text>
<text x="908" y="225" font-size="12.5" font-weight="600" fill="#047857" text-anchor="end" >19 个仓库 · 19 篇论文</text>
<text x="50" y="482" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >回测环境 · 模拟器 · 基准与实时竞技场 · 偏差控制 · 智能体循环、评测、追踪与状态</text>
<rect x="60" y="252" width="264" height="168" rx="12" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/>
<rect x="60" y="252" width="264" height="168" rx="12" fill="#0E74901F"/>
<circle cx="82" cy="276" r="12" fill="#0E7490"/>
<text x="82" y="281" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text>
<text x="102" y="281" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start" >数据层</text>
<text x="102" y="299" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >智能体看到什么</text>
<text x="76" y="330" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 行情、公告与新闻数据</text>
<text x="76" y="350" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· MCP 数据服务、数据集</text>
<text x="76" y="370" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 把文本变成信号</text>
<text x="76" y="406" font-size="12" font-weight="600" fill="#0E7490" text-anchor="start" >14 个仓库 · 5 篇论文</text>
<rect x="348" y="252" width="264" height="168" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<rect x="348" y="252" width="264" height="168" rx="12" fill="#4F46E51F"/>
<circle cx="370" cy="276" r="12" fill="#4F46E5"/>
<text x="370" y="281" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text>
<text x="390" y="281" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start" >Agent 层</text>
<text x="390" y="299" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >智能体如何思考</text>
<text x="364" y="330" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 金融基础模型与推理模型</text>
<text x="364" y="350" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 记忆、反思、辩论</text>
<text x="364" y="370" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 学习得到的（RL）策略</text>
<text x="364" y="406" font-size="12" font-weight="600" fill="#4F46E5" text-anchor="start" >8 个仓库 · 22 篇论文</text>
<rect x="636" y="252" width="264" height="168" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
<rect x="636" y="252" width="264" height="168" rx="12" fill="#B91C1C1F"/>
<circle cx="658" cy="276" r="12" fill="#B91C1C"/>
<text x="658" y="281" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text>
<text x="678" y="281" font-size="15" font-weight="700" fill="#0F172A" text-anchor="start" >执行层</text>
<text x="678" y="299" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >智能体如何下单</text>
<text x="652" y="330" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 券商与交易所工具</text>
<text x="652" y="350" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 引擎：回测与实盘同一套代码</text>
<text x="652" y="370" font-size="12.5" font-weight="400" fill="#0F172A" text-anchor="start" >· 把目标权重变成订单</text>
<text x="652" y="406" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="start" >13 个仓库 · 1 篇论文</text>
