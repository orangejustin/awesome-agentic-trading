<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The eight layers of a trading system</title>
<desc id="d">Data, perception, decision, alpha research, portfolio and risk, execution, evaluation and simulation, with the direction information flows.</desc>
<rect width="960" height="540" rx="16" fill="#F8FAFC"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="36" y="44" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start" >Eight jobs every LLM trading system does</text>
<text x="36" y="66" font-size="13.5" font-weight="400" fill="#475569" text-anchor="start" >Information flows left to right in time; evaluation reads what execution did.</text>
<rect x="36" y="176" width="156" height="98" rx="12" fill="#0E74901F" stroke="#0E7490" stroke-width="1.5"/>
<circle cx="58" cy="200" r="12" fill="#0E7490"/>
<text x="58" y="205" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text>
<text x="78" y="205" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Data</text>
<text x="50" y="228" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >What did it know,</text>
<text x="50" y="245" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >and when?</text>
<rect x="216" y="176" width="156" height="98" rx="12" fill="#0891B21F" stroke="#0891B2" stroke-width="1.5"/>
<circle cx="238" cy="200" r="12" fill="#0891B2"/>
<text x="238" y="205" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text>
<text x="258" y="205" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Perception</text>
<text x="230" y="228" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >Text and numbers</text>
<text x="230" y="245" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >into signals?</text>
<rect x="396" y="176" width="156" height="98" rx="12" fill="#4F46E51F" stroke="#4F46E5" stroke-width="1.5"/>
<circle cx="418" cy="200" r="12" fill="#4F46E5"/>
<text x="418" y="205" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text>
<text x="438" y="205" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Decision</text>
<text x="410" y="228" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >Given the signals,</text>
<text x="410" y="245" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >what is the call?</text>
<rect x="576" y="176" width="156" height="98" rx="12" fill="#B453091F" stroke="#B45309" stroke-width="1.5"/>
<circle cx="598" cy="200" r="12" fill="#B45309"/>
<text x="598" y="205" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >5</text>
<text x="618" y="205" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Portfolio &amp; risk</text>
<text x="590" y="228" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >How much, and when</text>
<text x="590" y="245" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >to stand down?</text>
<rect x="756" y="176" width="156" height="98" rx="12" fill="#B91C1C1F" stroke="#B91C1C" stroke-width="1.5"/>
<circle cx="778" cy="200" r="12" fill="#B91C1C"/>
<text x="778" y="205" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >6</text>
<text x="798" y="205" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Execution</text>
<text x="770" y="228" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >How does a decision</text>
<text x="770" y="245" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >become a safe fill?</text>
<rect x="396" y="84" width="156" height="70" rx="12" fill="#7C3AED1F" stroke="#7C3AED" stroke-width="1.5"/>
<circle cx="418" cy="108" r="12" fill="#7C3AED"/>
<text x="418" y="113" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4</text>
<text x="438" y="113" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Alpha research</text>
<text x="410" y="136" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >Find signals, not trades.</text>
<path d="M194 225 L212 225" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M374 225 L392 225" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M554 225 L572 225" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M734 225 L752 225" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M474 156 L474 172" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<rect x="576" y="328" width="336" height="82" rx="12" fill="#0478571F" stroke="#047857" stroke-width="1.5"/>
<circle cx="598" cy="352" r="12" fill="#047857"/>
<text x="598" y="357" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >7</text>
<text x="618" y="357" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Evaluation</text>
<text x="590" y="380" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >Is the result real? Baselines, bias control,</text>
<text x="590" y="397" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >uncertainty, a forward record.</text>
<rect x="576" y="440" width="336" height="66" rx="12" fill="#4755691F" stroke="#475569" stroke-width="1.5"/>
<circle cx="598" cy="464" r="12" fill="#475569"/>
<text x="598" y="469" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" >8</text>
<text x="618" y="469" font-size="14.5" font-weight="700" fill="#0F172A" text-anchor="start" >Simulation</text>
<text x="590" y="492" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >Study behavior without risking capital.</text>
<path d="M834 276 L834 324" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
<path d="M744 440 L744 414" stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#a)" transform="translate(0 0)"/>
<path d="M576 369 L474 369 L474 280" stroke="#047857" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
<text x="462" y="296" font-size="12" font-weight="600" fill="#047857" text-anchor="end" >feedback: score decisions</text>
<text x="462" y="312" font-size="12" font-weight="600" fill="#047857" text-anchor="end" >against what happened</text>
<rect x="36" y="328" width="404" height="178" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="54" y="358" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start" >How to read it</text>
<text x="54" y="379" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >A project gets a layer when it ships working code for that job,</text>
<text x="54" y="400" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >not when its README mentions it. Read across a row of the</text>
<text x="54" y="421" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >catalog to see what a project leaves to you; read down a</text>
<text x="54" y="442" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start" >column to see how few cover risk and execution.</text>
</svg>
