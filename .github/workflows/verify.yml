name: verify-sources

# Re-resolves every arXiv id and repository in the catalog, so drift is caught instead of inherited.
# Not part of ci.yml: it needs the network and a moved repository is a warning to review, not a broken change.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Papers (title and first-version date) and projects (still reachable)
        run: python tools/verify.py all
