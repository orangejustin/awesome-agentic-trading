name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the one optional dependency (card extraction tests)
        run: pip install -r tools/extract/requirements.txt
      - name: Catalog is valid
        run: python tools/build.py check
      - name: Generated pages, READMEs (both languages) and figures are current
        run: |
          python tools/build.py tables --check
          python tools/make_assets.py --check
          python -m tools.extract render --check
      - name: Tests (statistics against simulation, extraction against a fake server, docs links)
        run: python -m unittest discover -s tests -t . -v
      - name: Privacy lint
        run: python tools/privacy_lint.py
